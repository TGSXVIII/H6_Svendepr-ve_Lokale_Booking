<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merc Booking – Kom i gang</title>

    <link rel="stylesheet" href="../CSS/auth.css">
    <link rel="stylesheet" href="../CSS/shared.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a href="dashboard.html" aria-label="Til forsiden">
            <img
                class="auth-logo"
                src="../../Utilities/Images/Merc_Booking.png"
                alt="Merc Booking"
            >
        </a>

        <h1>Velkommen</h1>
        <p>Log ind, eller opret en konto for at komme i gang.</p>

        <div class="auth-actions">
            <a class="button" href="login.html">Log ind</a>
            <a class="button button-secondary" href="signup.html">
                Opret konto
            </a>
        </div>

        <div class="auth-divider">
            <span>eller</span>
        </div>

        <a class="auth-forgot-password" href="passwordReset.html">
            Glemt adgangskode?
        </a>

        <a
            class="auth-back-arrow"
            href="dashboard.html"
            aria-label="Tilbage til forsiden"
            title="Tilbage til forsiden"
        >
            <span aria-hidden="true">←</span>
        </a>
    </main>
</body>
</html>
