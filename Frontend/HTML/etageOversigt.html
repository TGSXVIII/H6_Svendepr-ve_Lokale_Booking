<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merc Booking – Etageoversigt</title>

    <script src="../JavaScript/theme.js"></script>
    <link rel="stylesheet" href="../CSS/loader.css">
    <script src="../JavaScript/loader.js" defer></script>

    <link rel="stylesheet" href="../CSS/shared.css">
    <link rel="stylesheet" href="../CSS/etageOversigt.css">
    <link rel="stylesheet" href="../CSS/theme.css">
    <link rel="stylesheet" href="../CSS/notifications.css">
    <link rel="stylesheet" href="../CSS/confirmation.css">
    
    <script src="../JavaScript/confirmation.js" defer></script>
    <script src="../JavaScript/notifications.js" defer></script>
    <script src="../JavaScript/session.js" defer></script>
    <script src="../JavaScript/script.js" defer></script>
    <script src="../JavaScript/etageOversigt.js" defer></script>
</head>

<body class="floor-page">
    <div id="sharedNavigation"></div>

    <main class="floor-panel">
        <aside class="floor-sidebar" aria-label="Vælg etage">
            <a href="dashboard.html" aria-label="Til forsiden">
                <img
                    class="floor-logo"
                    src="../../Utilities/Images/Merc_Booking.png"
                    alt="Merc Booking"
                >
            </a>

            <h1>Etageoversigt</h1>

            <p>
                Vælg en etage for at se skolens lokaler
                og deres placering.
            </p>

            <div
                class="floor-selector"
                role="group"
                aria-label="Vælg etage"
            >
                <button type="button" data-floor="1" aria-pressed="true">
                    Stueetagen
                </button>

                <button type="button" data-floor="2" aria-pressed="false">
                    1. etage
                </button>

                <button type="button" data-floor="3" aria-pressed="false">
                    2. etage
                </button>

                <button type="button" data-floor="4" aria-pressed="false">
                    3. etage
                </button>

                <button type="button" data-floor="5" aria-pressed="false">
                    4. etage
                </button>

                <button type="button" data-floor="6" aria-pressed="false">
                    5. etage
                </button>
            </div>

            <div class="floor-actions">
                <a class="button" href="lokaleoversigt.html">
                    Find og book et lokale
                </a>

                <a
                    class="floor-document-link"
                    href="../../Utilities/Documents/Lokaleoversigt.pdf"
                    target="_blank"
                    rel="noopener"
                >
                    Åbn hele oversigten som PDF
                </a>
            </div>

            <p class="floor-help">
                Klik på plantegningen for at åbne den
                i fuld størrelse.
            </p>

            <p class="floor-help">
                Plantegningen viser placeringer,
                ikke aktuelle bookinger.
            </p>
        </aside>

        <div class="floor-display">
            <div id="floorLoading"></div>

            <div
                id="floorViewer"
                class="floor-viewer"
                role="region"
                aria-label="Plantegning"
            ></div>
        </div>
    </main>
</body>
</html>
