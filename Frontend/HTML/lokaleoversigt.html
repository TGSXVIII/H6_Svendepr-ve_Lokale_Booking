<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merc Booking – Lokaleoversigt</title>
    
    <script src="../JavaScript/theme.js"></script>
    
    <link rel="stylesheet" href="../CSS/loader.css">
    <link rel="stylesheet" href="../CSS/notifications.css">
    <link rel="stylesheet" href="../CSS/confirmation.css">
    <link rel="stylesheet" href="../CSS/shared.css">
    <link rel="stylesheet" href="../CSS/lokaleoversigt.css">
    <link rel="stylesheet" href="../CSS/theme.css">

    <script src="../JavaScript/session.js" defer></script>
    <script src="../JavaScript/notifications.js" defer></script>
    <script src="../JavaScript/script.js" defer></script>
    <script src="../JavaScript/loader.js" defer></script>
    <script src="../JavaScript/lokaleoversigt.js" defer></script>
</head>

<body class="rooms-page">
    <div id="sharedNavigation"></div>
    <main class="rooms-panel">
        <a href="dashboard.html" aria-label="Til forsiden">
            <img
                class="rooms-logo"
                src="../../Utilities/Images/Merc_Booking.png"
                alt="Merc Booking"
            >
        </a>

        <h1>Find og book et lokale</h1>
        <p>Vælg et tidspunkt og find et lokale, der passer til dit behov.</p>

        <form id="roomSearchForm" class="room-filters">
            <div class="form-field">
                <label for="bookingDate">Dato</label>
                <input type="date" id="bookingDate" required>
            </div>

            <div class="form-field">
                <label for="startTime">Fra kl.</label>
                <select id="startTime" required><option value="">Vælg starttidspunkt</option></select>
            </div>

            <div class="form-field">
                <label for="endTime">Til kl.</label>
                <select id="endTime" required disabled><option value="">Vælg starttidspunkt først</option></select>
            </div>

            <div class="form-field">
                <label for="participants">Antal deltagere</label>
                <input
                    type="number"
                    id="participants"
                    min="1"
                    step="1"
                    value="1"
                    required
                >
            </div>

            <div class="form-field">
                <label for="floor">Etage</label>
                <select id="floor" disabled>
                    <option value="">Henter etager...</option>
                </select>
            </div>
            
            <div class="form-field">
                <label for="roomCategory">Lokaletype</label>

                <select id="roomCategory" disabled>
                    <option value="">Henter lokaletyper...</option>
                </select>
            </div>

            <fieldset class="equipment-filter">
                <legend>Udstyr</legend>
                <label><input type="checkbox" name="equipment" value="Projektor">Projektor</label>
                <label><input type="checkbox" name="equipment" value="Whiteboard">Whiteboard</label>
            </fieldset>

            <div class="room-actions">
                <button class="button search-button" type="submit">Find lokaler</button>
                <a class="button" href="etageOversigt.html">Se etager og lokalernes placering</a>
            </div>
        </form>
        <div id="roomsLoading"></div>
        <p id="searchMessage" role="status"></p>
        <div class="rooms-grid" id="roomsGrid"></div>
    </main>
    <dialog id="bookingDialog" class="confirmation-dialog booking-dialog" aria-labelledby="bookingTitle">
        <button id="closeBooking" class="menu-close booking-close" type="button" aria-label="Luk booking">&times;</button>
        <h2 id="bookingTitle">Book lokale</h2>
        <p id="bookingSummary"></p>

        <form id="bookingForm">
            <div class="form-field">
                <label for="bookingPurpose">Formål med bookingen</label>
                <textarea
                    id="bookingPurpose"
                    name="comment"
                    maxlength="300"
                    aria-describedby="bookingPurposeCounter"
                    required
                ></textarea>

                <p id="bookingPurposeCounter" class="character-counter">
                    0 / 300 tegn
                </p>
            </div>

            <p id="bookingMessage" role="status"></p>

            <div class="confirmation-actions">
                <button class="confirmation-button confirmation-accept" type="submit">
                    Send booking
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
