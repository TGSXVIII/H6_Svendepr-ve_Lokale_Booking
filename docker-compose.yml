services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Udfyld POSTGRES_USER i .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Udfyld POSTGRES_PASSWORD i .env}
      POSTGRES_DB: ${POSTGRES_DB:?Udfyld POSTGRES_DB i .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data: